services:
  web:
    build: .
    ports:
      - "8080:80"
    restart: unless-stopped
    # Live-edit mode: the app files are mounted over the baked-in copies,
    # so changes show up on refresh without rebuilding the image.
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./css:/usr/share/nginx/html/css:ro
      - ./js:/usr/share/nginx/html/js:ro
