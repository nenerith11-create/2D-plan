server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static app
    location / {
        try_files $uri $uri/ =404;
    }

    # Same-origin proxy to the Claude API for the Auto-remodel feature.
    # Set the app's API base URL to http://localhost:8080/anthropic and
    # requests avoid CORS entirely (and ad-blockers have nothing to flag).
    location /anthropic/ {
        proxy_pass https://api.anthropic.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.anthropic.com;
        proxy_http_version 1.1;
        client_max_body_size 25m;      # base64 floor plan images
        proxy_read_timeout 300s;       # model responses can take a while
        proxy_send_timeout 300s;
    }
}
